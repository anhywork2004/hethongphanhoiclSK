name: Cloudflare Workers CI/CD Deployment

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Workers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web-admin/package-lock.json

      - name: Install Dependencies
        run: |
          cd web-admin
          npm ci

      - name: Type Check & Verify Next.js App
        run: |
          cd web-admin
          npx tsc --noEmit

      - name: Build Next.js for Cloudflare
        run: |
          cd web-admin
          npm run cf:build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'web-admin'
          command: deploy
